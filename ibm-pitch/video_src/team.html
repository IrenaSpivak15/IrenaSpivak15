<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#05090d;font-family:"Liberation Sans",Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#0d2a33 0%,#061016 55%,#04070a 100%)}
.grid{position:absolute;inset:-80px;background-image:linear-gradient(rgba(46,200,240,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(46,200,240,.07) 1px,transparent 1px);background-size:40px 40px}
.frame{position:absolute;left:50px;top:36px;width:1180px;height:530px;border-radius:20px;overflow:hidden;border:2px solid #2a5566;box-shadow:0 0 50px rgba(46,200,240,.18);animation:fin .8s both}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:kb 5s linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes fin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.cap{position:absolute;top:590px;left:0;right:0;text-align:center;font-size:36px;font-weight:bold;animation:up .8s .6s both}
.sub{position:absolute;top:645px;left:0;right:0;text-align:center;font-size:23px;color:#6ee0a8;animation:up .8s 1.1s both}
.sub b{color:#2ec8f0}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="frame"><img src="team.jpg"></div>
<div class="cap">הצוות מאחורי ״איפה הכסף?״</div>
<div class="sub">מציגים את השכבה הסמנטית שנבנתה על <b>IBM&nbsp;Bob</b></div>
</body></html>
