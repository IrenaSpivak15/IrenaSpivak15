<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Liberation Sans",Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cap{position:absolute;left:0;right:0;top:950px;text-align:center;color:#fff;font-size:46px;font-weight:bold;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 3px #000;animation:up .5s .9s both}
.cap b{color:#6ee0a8}
</style></head><body>
<div class="cap">ומכאן — <b>המסלול האופטימלי</b>.<br>לא רק מוצאים: מנווטים.</div>
</body></html>
