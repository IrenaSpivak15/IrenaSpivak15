<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#05090d;font-family:"Liberation Sans",Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#0d2a33 0%,#061016 55%,#04070a 100%)}
.grid{position:absolute;inset:-80px;background-image:linear-gradient(rgba(46,200,240,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(46,200,240,.07) 1px,transparent 1px);background-size:40px 40px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.t{position:absolute;top:215px;left:0;right:0;text-align:center;font-size:92px;font-weight:bold;animation:up .8s .3s both}
.s{position:absolute;top:350px;left:0;right:0;text-align:center;font-size:34px;color:#6ee0a8;font-weight:bold;animation:up .8s .8s both}
.s b{color:#2ec8f0}
.m{position:absolute;top:470px;left:0;right:0;text-align:center;font-size:24px;color:#8fb3c0;direction:ltr;letter-spacing:2px;animation:up .8s 1.3s both}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="t">איפה הכסף?</div>
<div class="s">רכיב ניווט ארגוני ל-<b>IBM&nbsp;Bob</b></div>
<div class="m">IBM CHALLENGE 2026 · eifo-money.fit</div>
</body></html>
