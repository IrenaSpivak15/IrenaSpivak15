<style>
:root{
  --bg:#f3ede2;--paper:#fbf8f2;--ink:#2b2622;--muted:#7d746b;--accent:#d9577e;--accent2:#c8662e;
  --shadow:0 20px 50px rgba(60,40,20,.18);--fs:22px;
}
body.sepia{--bg:#e9dcc4;--paper:#f4e8d2;--ink:#3b2f22;--muted:#7f6e58}
body.night{--bg:#16151c;--paper:#22212a;--ink:#e9e4da;--muted:#9a95a5;--shadow:0 20px 50px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;transition:background .4s,color .4s;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:4px;padding:0 10px;z-index:20}
.bar .title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;opacity:.85;padding-left:4px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;transition:background .2s;flex:none}
.ib:hover{background:rgba(127,110,90,.14)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--accent);color:#fff}
.txt-btn{font-weight:800;font-size:15px}
.ib.share{background:var(--accent);color:#fff}
.ib.share:hover{background:var(--accent);filter:brightness(1.08)}

.stage{position:fixed;inset:56px 0 64px 0;display:grid;place-items:center;padding:10px 18px;perspective:2200px}
.book{position:relative;width:min(1100px,100%);height:100%;max-height:720px}
.page{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;opacity:0;pointer-events:none;transform-origin:left center;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.page.active{opacity:1;pointer-events:auto;transform:none}
.page.out-left{transform:rotateY(-14deg) translateX(-4%);opacity:0}
.page.out-right{transform:rotateY(10deg) translateX(4%);opacity:0}
.art{position:relative;overflow:hidden;background:#e8e0d0}
.art img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:transform 6s ease}
.page.active .art img{transform:scale(1)}
.text{position:relative;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(28px,6vw,80px)}
.text .run{position:absolute;top:22px;right:28px;font-family:Lora,serif;font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.text .num{position:absolute;bottom:20px;right:28px;font-family:Lora,serif;color:var(--muted);font-size:14px}
.text .quote-btn{position:absolute;bottom:14px;left:clamp(20px,5vw,72px);display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:800;color:var(--accent);padding:7px 12px;border-radius:999px;border:1.5px solid currentColor;opacity:.85}
.text .quote-btn:hover{opacity:1}
.text .quote-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.text p{font-family:Lora,Georgia,serif;font-size:var(--fs);line-height:1.62;hyphens:auto;-webkit-hyphens:auto}
.text p.first::first-letter{float:left;font-size:3.1em;line-height:.9;padding:.06em .1em 0 0;color:var(--accent);font-weight:600}
.page.active .text p{animation:rise .8s .15s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.cover .art img{object-position:center 30%}
.cover .cv{align-items:flex-start;gap:4px}
.kicker{font-weight:800;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2)}
.cover h1{font-family:Lora,serif;font-weight:600;font-size:clamp(28px,3.6vw,46px);line-height:1.15;margin-top:6px}
.cover .by{margin-top:8px;font-family:Lora,serif;font-style:italic;color:var(--muted);font-size:18px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font-weight:800;padding:13px 24px;border-radius:999px;box-shadow:0 8px 22px rgba(217,87,126,.35);transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-weight:800}
.row{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.end .text{text-align:center;align-items:center}
.end .row{justify-content:center}
.end h2{font-family:Lora,serif;font-size:clamp(30px,4vw,46px);color:var(--accent)}
.end .sub{margin-top:10px;color:var(--muted);font-family:Lora,serif;font-style:italic;font-size:18px}

.nav{position:fixed;inset:auto 0 0 0;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20}
.nav .arrow{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.1);display:grid;place-items:center}
.nav .arrow:disabled{opacity:.35;cursor:default}
.nav .arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.progress{flex:1;display:flex;gap:5px;align-items:center}
.progress button{flex:1;height:6px;border-radius:3px;background:rgba(127,110,90,.25);transition:background .3s,height .2s}
.progress button:hover{height:10px}
.progress button.done{background:var(--accent2)}
.progress button.cur{background:var(--accent)}
.counter{font-weight:800;font-size:14px;min-width:60px;text-align:center;color:var(--muted)}
.tap{position:fixed;top:56px;bottom:64px;width:10vw;z-index:5}
.tap.l{left:0}.tap.r{right:0}

/* modals */
.panel{position:fixed;inset:0;background:rgba(20,15,10,.5);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.panel.open{display:flex}
.sheet{background:var(--paper);color:var(--ink);border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px 24px;box-shadow:var(--shadow)}
.sheet.sm{max-width:520px}
.sheet h3{font-family:Lora,serif;font-size:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.thumb{text-align:left;border-radius:12px;overflow:hidden;background:var(--bg);transition:transform .2s;outline:3px solid transparent}
.thumb:hover{transform:translateY(-3px)}
.thumb.cur{outline-color:var(--accent)}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.thumb span{display:block;padding:7px 9px;font-size:12px;font-weight:600;line-height:1.3;color:var(--muted)}
.thumb b{color:var(--ink)}

.share-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px}
.sopt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:14px;background:var(--bg);font-weight:700;font-size:13px;text-align:center;text-decoration:none;color:inherit}
.sopt:hover{outline:2px solid var(--accent)}
.sopt i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:18px}
.linkbox{display:flex;gap:8px;margin-top:14px}
.linkbox input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid rgba(127,110,90,.35);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.muted{color:var(--muted);font-size:14px}

.card-preview{width:100%;border-radius:14px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.15);background:var(--bg)}

/* quiz */
.qstep{font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.qtext{font-family:Lora,serif;font-size:21px;line-height:1.4;margin:8px 0 16px}
.qans{display:grid;gap:10px}
.qans button{text-align:left;padding:14px 16px;border-radius:14px;background:var(--bg);font-weight:600;line-height:1.35;transition:transform .15s}
.qans button:hover{transform:translateX(4px);outline:2px solid var(--accent)}
.meter{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--a),var(--accent2) var(--a));margin:14px 0 6px}
.meter-l{display:flex;justify-content:space-between;font-weight:800;font-size:13px}

.hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .4s;pointer-events:none;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.hint.show{opacity:.92}

@media (max-width:760px){
  .stage{padding:6px 10px}
  .book{max-height:none}
  .page{grid-template-columns:1fr;grid-template-rows:42% 58%}
  .text{padding:22px 22px 60px;justify-content:flex-start;overflow:auto}
  .text .run{display:none}
  .text .num{bottom:18px}
  .text .quote-btn{bottom:12px;left:22px}
  .cover{grid-template-rows:52% 48%}
  .cover .cv{justify-content:center;padding-bottom:22px}
  .end .text{justify-content:center;padding-bottom:22px}
  .row{margin-top:16px}
  .tap{display:none}
  .bar .title{font-size:13px}
  #fsDown,#fsUp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ===== content ===== */
const BOOK_TITLE = 'Ая и Серж: Сказка о горе и пути';
const AUTHOR = 'Ирена Спивак';
// Public address of the app. When opened from its own host the real URL is used;
// in sandboxed previews (no shareable URL) this fallback is used instead.
const FALLBACK_URL = 'https://irenaspivak15.github.io/IrenaSpivak15/aya-serge/';
const PAGES = [
  {img:"img/p2.jpg", text:"Ая была круглой. Абсолютно, совершеннейше круглой, без единого острого угла или рационального тормоза. Она катилась по жизни на волне чистого вдохновения, искренне полагая, что Вселенная создана для удивления, а где-то там, за горизонтом, возвышается Гора — великая, туманная и обещающая нечто невообразимое."},
  {img:"img/p3.jpg", text:"Серж был квадратным. Его параллельно-перпендикулярный мир строился на фундаментальных законах логики, строгих графиках и выверенных маршрутах. У Сержа всё имело форму, причину и хронометраж. Он твердо знал: движение без карты — это не романтика, а дезориентация и чистейший хаос."},
  {img:"img/p4.jpg", text:"Когда их траектории пересеклись на опушке, Ая радостно всплеснула ладонями: «Серж, смотри, там Гора! Пошли скорее!» Серж приостановился, извлек из кармана компас, развернул миллиметровку и сухо замешкался: «Маршрут не утвержден. Но если мы составим график и рассчитаем ресурсы, экспедиция имеет смысл»."},
  {img:"img/p5.jpg", text:"И они отправились в путь. На каждом перекрестке Серж вымерял транспортиром угол наименьшего сопротивления и выбирал кратчайшую прямую. Ая же немедленно отвлекалась на витиеватые тропинки, где мхи шептались о древних тайнах, а солнечные зайчики вели себя абсолютно бессистемно."},
  {img:"img/p6.jpg", text:"Серж нервничал: отклонение от графика грозило нарушением баланса энтропии. Но глядя, как Ая замирает перед каждым диким цветком, он вдруг поймал себя на мысли, что его точнейший секундомер впервые в жизни не имеет никакого значения перед лицом этого мгновения."},
  {img:"img/p7.jpg", text:"Когда путь становился крутым, а бурлящие горные ручьи пугали непредсказуемостью, квадратная устойчивость Сержа становилась надежной опорой. А когда уныние усталости сжимало тиски, округлая легкость Аи возвращала в воздух смех и веру в чудо. Они были не препятствием друг для друга, а недостающим пазлом."},
  {img:"img/mountain.jpg", pos:"center 30%", text:"К вечеру, когда закатное солнце выкрасило облака в багрово-золотой бархат, они вышли к подножию. Гора возвышалась над ними — величественная, заснеженная, молчаливая и, казалось, совершенно недосягаемая в своей монументальности."},
  {img:"img/p9.jpg", text:"Опустилась прохладная сумеречная тишина. Серж по привычке четко и аккуратно сложил костерок, чиркнул спичкой, и уютное пламя озарило их маленькую стоянку. Они уселись у огня, сжимая в ладонях теплые кружки с пряным чаем."},
  {img:"img/p10.jpg", text:"Серж отложил в сторону подробную карту, посмотрел на пляшущие угли и тихо ответил: «Я тоже это чувствую, Ая. Вершина — это лишь красивый повод выйти из дома. А сам смысл... он не в отметке над уровнем моря. Он в том, чтобы идти вместе и уметь греть ладони у одного огня»."}
];

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}
function flash(t){const h=$('hint');h.textContent=t;h.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>h.classList.remove('show'),2600)}
function baseUrl(){
  const ok=/^https?:$/.test(location.protocol)&&!/claudeusercontent|localhost|127\.0\.0\.1/.test(location.hostname)&&window.top===window;
  if(ok)return location.origin+location.pathname;
  return FALLBACK_URL||(location.origin+location.pathname);
}
function pageUrl(n){return n>0?baseUrl()+'#p'+n:baseUrl()}
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{const i=$('shareLink');i.value=text;i.select();return document.execCommand('copy')}catch(e){return false}
}
const QUOTE_ICON='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>';

/* ===== build book ===== */
const book=$('book');
const N=PAGES.length+2;
let cur=0,fs=22,theme=0,speaking=false;

book.appendChild(el(`<section class="page cover"><div class="art"><img src="img/cover.jpg" alt="Ая и Серж на тропе к горе"></div>
  <div class="text cv"><div class="kicker">Сказка</div><h1>Ая и Серж:<br>Сказка о горе и пути</h1><div class="by">${AUTHOR}</div>
  <div class="row"><button class="cta" data-go="1">Начать чтение →</button><button class="ghost" data-quiz>Кто ты — Ая или Серж?</button></div></div></section>`));
PAGES.forEach((p,i)=>{
  book.appendChild(el(`<section class="page"><div class="art"><img src="${p.img}" alt="Иллюстрация к странице ${i+1}" loading="${i<2?'eager':'lazy'}" style="${p.pos?'object-position:'+p.pos:''}"></div>
  <div class="text"><div class="run">${AUTHOR}</div><p class="${i===0?'first':''}">${p.text}</p>
  <button class="quote-btn" data-card="${i}">${QUOTE_ICON}Открытка</button><div class="num">${i+1}</div></div></section>`));
});
book.appendChild(el(`<section class="page end"><div class="art"><img src="img/p10.jpg" alt="Ая и Серж у костра" loading="lazy"></div>
  <div class="text"><h2>Конец</h2><div class="sub">Смысл — в том, чтобы идти вместе.</div>
  <div class="row"><button class="cta" data-share>Поделиться сказкой</button><button class="ghost" data-quiz>Пройти тест</button><button class="ghost" data-go="0">↺ Сначала</button></div></div></section>`));

const pages=[...book.children];
const prog=$('progress');
for(let i=0;i<N;i++){const b=document.createElement('button');b.title=i===0?'Обложка':i===N-1?'Конец':'Страница '+i;b.setAttribute('aria-label',b.title);b.onclick=()=>go(i);prog.appendChild(b)}

const grid=$('grid');
[{img:'img/cover.jpg',label:'<b>Обложка</b>'}]
  .concat(PAGES.map((p,i)=>({img:p.img,label:`<b>${i+1}.</b> ${p.text.split(' ').slice(0,5).join(' ')}…`})))
  .concat([{img:'img/p10.jpg',label:'<b>Конец</b>'}])
  .forEach((t,i)=>{const b=el(`<button class="thumb"><img src="${t.img}" alt="" loading="lazy"><span>${t.label}</span></button>`);b.onclick=()=>{go(i);closeAll()};grid.appendChild(b)});

function go(n,fromHash){
  n=Math.max(0,Math.min(N-1,n)); if(n===cur&&pages[n].classList.contains('active'))return;
  stopSpeak();
  const dir=n>cur?'out-left':'out-right';
  pages.forEach((p,i)=>{p.classList.remove('out-left','out-right');if(i===cur&&i!==n)p.classList.add(dir);p.classList.toggle('active',i===n)});
  cur=n;store.set('aya-page',n);
  if(!fromHash){try{history.replaceState(null,'',n>0&&n<N-1?'#p'+n:n===N-1?'#end':location.pathname+location.search)}catch(e){}}
  $('prev').disabled=n===0;$('next').disabled=n===N-1;
  [...prog.children].forEach((b,i)=>{b.classList.toggle('cur',i===n);b.classList.toggle('done',i<n)});
  [...grid.children].forEach((b,i)=>b.classList.toggle('cur',i===n));
  $('counter').textContent=n===0?'Обложка':n===N-1?'Конец':`${n} / ${PAGES.length}`;
  const nx=pages[n+1]?.querySelector('img');if(nx)nx.loading='eager';
}
function fromHash(){const h=location.hash;if(/^#p\d+$/.test(h))return +h.slice(2);if(h==='#end')return N-1;if(h==='#quiz')return 'quiz';return null}

/* ===== events ===== */
document.addEventListener('click',e=>{
  const t=e.target;
  const g=t.closest('[data-go]');if(g)go(+g.dataset.go);
  if(t.closest('[data-quiz]'))openQuiz();
  if(t.closest('[data-share]'))openShare();
  const c=t.closest('[data-card]');if(c)openCard(+c.dataset.card);
  if(t.closest('[data-close]'))closeAll();
  if(t.classList.contains('panel'))closeAll();
});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('tapL').onclick=()=>go(cur-1);$('tapR').onclick=()=>go(cur+1);
$('tocBtn').onclick=()=>openPanel('tocPanel');
$('shareBtn').onclick=()=>openShare();
$('quizBtn').onclick=()=>openQuiz();
document.addEventListener('keydown',e=>{
  if(document.querySelector('.panel.open')){if(e.key==='Escape')closeAll();return}
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0);if(e.key==='End')go(N-1);
});
let sx=null,sy=null;
book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(cur+(dx<0?1:-1));sx=null},{passive:true});
window.addEventListener('hashchange',()=>{const h=fromHash();if(h==='quiz')openQuiz();else if(h!==null)go(h,true)});

function openPanel(id){closeAll();$(id).classList.add('open')}
function closeAll(){document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'))}

/* font + theme */
function setFs(v){fs=Math.max(16,Math.min(32,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('aya-fs',fs)}
$('fsUp').onclick=()=>setFs(fs+2);$('fsDown').onclick=()=>setFs(fs-2);
const themes=['','sepia','night'];
function setTheme(t){theme=t%3;document.body.className=themes[theme];store.set('aya-theme',theme)}
$('themeBtn').onclick=()=>setTheme(theme+1);

/* read aloud */
const synth=window.speechSynthesis;
function voiceRu(){try{return synth.getVoices().find(v=>/^ru/i.test(v.lang))}catch(e){return null}}
function stopSpeak(){speaking=false;$('speakBtn').classList.remove('on');try{synth&&synth.cancel()}catch(e){}}
function speakPage(){
  if(!synth){flash('Озвучка не поддерживается в этом браузере');stopSpeak();return}
  if(cur===0||cur===N-1)go(1);
  speaking=true;$('speakBtn').classList.add('on');
  const p=pages[cur].querySelector('.text p');if(!p){stopSpeak();return}
  const u=new SpeechSynthesisUtterance(p.textContent);u.lang='ru-RU';u.rate=.92;const v=voiceRu();if(v)u.voice=v;
  u.onend=()=>{if(!speaking)return;if(cur<N-2){go(cur+1);setTimeout(speakPage,900)}else stopSpeak()};
  u.onerror=()=>stopSpeak();
  try{synth.cancel();synth.speak(u)}catch(e){stopSpeak()}
}
$('speakBtn').onclick=()=>speaking?stopSpeak():speakPage();

/* ===== share ===== */
let scope='book';
function shareText(){
  if(scope==='page'&&cur>0&&cur<N-1)return `«${QUOTES[cur-1]}» — ${BOOK_TITLE}, стр. ${cur}`;
  return `${BOOK_TITLE} — иллюстрированная сказка ${AUTHOR==='Ирена Спивак'?'Ирены Спивак':AUTHOR}`;
}
function shareLink(){return scope==='page'?pageUrl(cur):pageUrl(0)}
function renderShare(){
  const url=shareLink(),txt=shareText(),eu=encodeURIComponent(url),et=encodeURIComponent(txt);
  $('shareLink').value=url;
  const opts=[
    {n:'WhatsApp',c:'#25D366',l:'W',h:`https://wa.me/?text=${et}%20${eu}`},
    {n:'Telegram',c:'#229ED9',l:'T',h:`https://t.me/share/url?url=${eu}&text=${et}`},
    {n:'ВКонтакте',c:'#0077FF',l:'VK',h:`https://vk.com/share.php?url=${eu}&title=${et}`},
    {n:'Facebook',c:'#1877F2',l:'f',h:`https://www.facebook.com/sharer/sharer.php?u=${eu}`},
    {n:'Почта',c:'#8a8178',l:'@',h:`mailto:?subject=${encodeURIComponent(BOOK_TITLE)}&body=${et}%0A${eu}`},
  ];
  const box=$('shareOpts');box.innerHTML='';
  if(navigator.share&&!IN_FRAME){const b=el(`<button class="sopt"><i style="background:var(--accent)">↗</i>Отправить…</button>`);b.onclick=async()=>{try{await navigator.share({title:BOOK_TITLE,text:txt,url})}catch(e){}};box.appendChild(b)}
  opts.forEach(o=>box.appendChild(el(`<a class="sopt" href="${o.h}" target="_blank" rel="noopener"><i style="background:${o.c}">${o.l}</i>${o.n}</a>`)));
  if(cur>0&&cur<N-1){const b=el(`<button class="sopt"><i style="background:var(--accent2)">❝</i>Открытка</button>`);b.onclick=()=>openCard(cur-1);box.appendChild(b)}
}
function openShare(){
  const onPage=cur>0&&cur<N-1;
  $('shareScope').style.display=onPage?'':'none';
  if(!onPage)scope='book';
  [...$('shareScope').children].forEach(b=>b.classList.toggle('on',b.dataset.scope===scope));
  renderShare();openPanel('sharePanel');
}
$('shareScope').onclick=e=>{const b=e.target.closest('button');if(!b)return;scope=b.dataset.scope;[...$('shareScope').children].forEach(x=>x.classList.toggle('on',x===b));renderShare()};
$('copyLink').onclick=async()=>flash(await copy($('shareLink').value)?'Ссылка скопирована':'Выделите ссылку и скопируйте вручную');

/* ===== quote / result cards (canvas) ===== */
const imgCache={};
function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src}))}
async function fontsReady(){try{await document.fonts.load('600 40px Lora');await document.fonts.load('italic 40px Lora');await document.fonts.load('800 20px Nunito')}catch(e){}}
function wrap(ctx,text,maxW){
  const words=text.split(' '),lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines;
}
function cover(ctx,img,x,y,w,h,fy=.35){
  const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)*fy,sw,sh,x,y,w,h);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* opts: {img, quote, label, fmt, foot} */
async function drawCard(o){
  await fontsReady();
  const W=1080,H=o.fmt==='story'?1920:1350;
  const cv=$('cv');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  const img=await loadImg(o.img);
  ctx.fillStyle='#fbf8f2';ctx.fillRect(0,0,W,H);
  const artH=o.fmt==='story'?1100:720;
  cover(ctx,img,0,0,W,artH,o.fy??.3);
  const g=ctx.createLinearGradient(0,artH-260,0,artH);g.addColorStop(0,'rgba(251,248,242,0)');g.addColorStop(1,'#fbf8f2');ctx.fillStyle=g;ctx.fillRect(0,artH-260,W,260);
  // quote
  const pad=90,maxW=W-pad*2;
  let size=o.fmt==='story'?60:54,lines;
  ctx.textBaseline='alphabetic';
  const avail=H-artH-200;
  do{ctx.font=`italic ${size}px Lora, Georgia, serif`;lines=wrap(ctx,o.quote,maxW);size-=2}while(lines.length*size*1.4>avail&&size>28);
  size+=2;const lh=size*1.4;
  let y=artH+20+(avail-lines.length*lh)/2+size;
  ctx.fillStyle='#d9577e';ctx.font='600 150px Lora, serif';ctx.globalAlpha=.25;ctx.fillText('“',W-pad-70,artH+150);ctx.globalAlpha=1;
  ctx.fillStyle='#2b2622';ctx.font=`italic ${size}px Lora, Georgia, serif`;
  lines.forEach(l=>{ctx.fillText(l,pad,y);y+=lh});
  // label pill
  if(o.label){ctx.font='800 30px Nunito, sans-serif';const tw=ctx.measureText(o.label).width;roundRect(ctx,pad,artH-40,tw+48,62,31);ctx.fillStyle='#d9577e';ctx.fill();ctx.fillStyle='#fff';ctx.fillText(o.label,pad+24,artH+2)}
  // footer
  ctx.fillStyle='#c8662e';ctx.fillRect(pad,H-150,80,6);
  ctx.fillStyle='#2b2622';ctx.font='600 36px Lora, serif';ctx.fillText(BOOK_TITLE,pad,H-90);
  ctx.fillStyle='#8a8178';ctx.font='italic 30px Lora, serif';ctx.fillText(o.foot||AUTHOR,pad,H-46);
  return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',.9));
}
let cardOpts=null,cardBlob=null;
async function renderCard(){
  $('cardImg').style.opacity=.4;
  try{cardBlob=await drawCard(cardOpts);const u=URL.createObjectURL(cardBlob);const old=$('cardImg').src;$('cardImg').src=u;if(old.startsWith('blob:'))URL.revokeObjectURL(old)}
  catch(e){flash('Не удалось создать открытку')}
  $('cardImg').style.opacity=1;
}
function openCard(i,fmt){
  const p=PAGES[i];
  cardOpts={img:p.img,quote:QUOTES[i],label:'Страница '+(i+1),fmt:fmt||'square',fy:p.pos?.3:.3,link:pageUrl(i+1),file:`aya-serzh-${i+1}.jpg`};
  [...$('cardFmt').children].forEach(b=>b.classList.toggle('on',b.dataset.fmt===cardOpts.fmt));
  openPanel('cardPanel');renderCard();
}
$('cardFmt').onclick=e=>{const b=e.target.closest('button');if(!b||!cardOpts)return;cardOpts.fmt=b.dataset.fmt;[...$('cardFmt').children].forEach(x=>x.classList.toggle('on',x===b));renderCard()};
const IN_FRAME=window.top!==window;
let dl=null;try{window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{})}catch(e){}
async function saveBlob(blob,name){
  if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==='declined')return false}}
  if(IN_FRAME&&!dl){flash('Скачивание недоступно здесь — откройте приложение по ссылке');return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
$('cardSave').onclick=async()=>{if(cardBlob&&await saveBlob(cardBlob,cardOpts.file))flash('Открытка сохранена')};
$('cardShare').onclick=async()=>{
  if(!cardBlob)return;
  const file=new File([cardBlob],cardOpts.file,{type:'image/jpeg'});
  const data={files:[file],title:BOOK_TITLE,text:`${cardOpts.quote}\n${cardOpts.link}`};
  if(!IN_FRAME&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share(data)}catch(e){}return}
  const c=await copy(cardOpts.link);const sv=await saveBlob(cardBlob,cardOpts.file);flash(sv?'Открытка сохранена, ссылка скопирована':c?'Ссылка скопирована':'Не удалось отправить');
};

/* ===== quiz ===== */
const QUIZ=[
  {q:'Впереди выходные. Твой план?',a:[['Посмотрю, куда позовёт настроение',2],['Наполовину план, наполовину сюрприз',0],['Расписание по часам уже готово',-2]]},
  {q:'На развилке тропинок ты…',a:[['Сворачиваю туда, где поют птицы',2],['Спрашиваю спутника',0],['Сверяюсь с картой и компасом',-2]]},
  {q:'В рюкзаке у тебя обязательно есть…',a:[['Блокнот для внезапных идей',2],['Термос с чаем на двоих',0],['Спички, аптечка, запасные носки',-2]]},
  {q:'Друг предлагает: «Идём на Гору прямо сейчас!»',a:[['«Пошли скорее!»',2],['«Только захвачу куртку»',0],['«Сначала рассчитаем ресурсы»',-2]]},
  {q:'Что тебя радует больше всего?',a:[['Дикий цветок у дороги',2],['Смех у костра',0],['Точно выполненный план',-2]]},
  {q:'Когда путь становится крутым, ты…',a:[['Шучу и подбадриваю остальных',2],['Держу друга за руку',0],['Ищу самую надёжную опору',-2]]},
];
const RESULTS={
  aya:{name:'Ты — Ая',img:'img/p2.jpg',fy:.25,text:'Ты катишься по жизни на волне вдохновения и видишь чудо в каждом солнечном зайчике. Рядом с тобой даже самый строгий маршрут превращается в приключение.'},
  serzh:{name:'Ты — Серж',img:'img/p3.jpg',fy:.3,text:'Ты — надёжная опора: у тебя всегда есть карта, компас и план. Но и ты знаешь, что иногда секундомер можно отложить ради одного мгновения.'},
  both:{name:'Ты — Ая и Серж вместе',img:'img/p7.jpg',fy:.3,text:'В тебе есть и округлая лёгкость, и квадратная устойчивость. Ты сам себе недостающий пазл — и отличный спутник в любом пути.'},
};
let qi=0,qs=0;
function openQuiz(){qi=0;qs=0;renderQ();openPanel('quizPanel')}
function closeBtn(){return '<button class="ib" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'}
function renderQ(){
  const b=$('quizBody');
  if(qi<QUIZ.length){
    const q=QUIZ[qi];
    const ans=[...q.a].sort(()=>Math.random()-.5);
    b.innerHTML=`<h3>Кто ты — Ая или Серж? ${closeBtn()}</h3><div class="qstep">Вопрос ${qi+1} из ${QUIZ.length}</div><div class="qtext">${q.q}</div><div class="qans">${ans.map(a=>`<button data-v="${a[1]}">${a[0]}</button>`).join('')}</div>`;
    b.querySelectorAll('.qans button').forEach(x=>x.onclick=()=>{qs+=+x.dataset.v;qi++;renderQ()});
    return;
  }
  const max=QUIZ.length*2,pct=Math.round((qs+max)/(2*max)*100);
  const key=pct>=62?'aya':pct<=38?'serzh':'both',r=RESULTS[key];
  store.set('aya-quiz',key);
  b.innerHTML=`<h3>${r.name} ${closeBtn()}</h3>
    <img src="${r.img}" alt="" style="width:100%;height:220px;object-fit:cover;object-position:center ${r.fy*100}%;border-radius:14px">
    <div class="meter" style="--a:${pct}%"></div><div class="meter-l"><span style="color:var(--accent)">Ая ${pct}%</span><span style="color:var(--accent2)">Серж ${100-pct}%</span></div>
    <p style="font-family:Lora,serif;font-size:18px;line-height:1.5;margin-top:12px">${r.text}</p>
    <div class="row" style="justify-content:center"><button class="cta" id="qShare">Поделиться результатом</button><button class="ghost" id="qAgain">Ещё раз</button><button class="ghost" data-go="1" data-close>Читать сказку</button></div>`;
  $('qAgain').onclick=()=>{qi=0;qs=0;renderQ()};
  $('qShare').onclick=()=>{
    cardOpts={img:r.img,fy:r.fy,quote:`${r.name}! ${r.text.split('. ')[0]}.`,label:`Ая ${pct}% · Серж ${100-pct}%`,fmt:'square',foot:'Пройди тест и прочитай сказку',link:baseUrl()+'#quiz',file:'aya-ili-serzh.jpg'};
    [...$('cardFmt').children].forEach(x=>x.classList.toggle('on',x.dataset.fmt==='square'));
    openPanel('cardPanel');renderCard();
  };
}

/* ===== init ===== */
setFs(+(store.get('aya-fs')||(innerWidth<760?19:22)));
setTheme(+(store.get('aya-theme')||0));
pages[0].classList.add('active');
const h=fromHash(),saved=+(store.get('aya-page')||0);
cur=-1;
if(typeof h==='number')go(h,true);else go(saved>0&&saved<N?saved:0);
if(h==='quiz')openQuiz();
if(innerWidth>760&&cur===0)setTimeout(()=>flash('← → листать · свайп на телефоне'),900);
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
