<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: 'Heebo', sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  /* ---------- scene 1: scrolling at night ---------- */
  #s1 { background: radial-gradient(ellipse at 50% 55%, #1b2550 0%, #070a1a 60%, #020308 100%); }
  #phone1 { position: absolute; left: 50%; top: 52%; width: 560px; height: 1120px; margin-left: -280px; margin-top: -560px;
            border-radius: 70px; background: #0b0b10; border: 14px solid #1d1d26;
            box-shadow: 0 0 220px 60px rgba(90,140,255,.35); overflow: hidden; }
  #feed { position: absolute; left: 0; right: 0; top: 0; }
  .card { height: 1092px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 120px;
          font-size: 150px; position: relative; }
  .card .bar { position: absolute; right: 26px; bottom: 140px; display: flex; flex-direction: column; gap: 34px; font-size: 52px; }
  .card .line { position: absolute; left: 40px; right: 120px; bottom: 60px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.5); }
  .card .line2 { bottom: 100px; right: 260px; background: rgba(255,255,255,.75); }
  #hand { position: absolute; left: 50%; top: 1500px; width: 300px; height: 520px; margin-left: 40px;
          background: linear-gradient(180deg, #c58c6c, #8b5a43); border-radius: 150px 150px 60px 60px; transform: rotate(-12deg);
          filter: brightness(.55) saturate(.8); }
  #thumb { position: absolute; left: 50%; top: 1250px; width: 110px; height: 300px; margin-left: 20px;
           background: linear-gradient(180deg, #d6a07f, #9b6a50); border-radius: 55px; transform-origin: 50% 100%; filter: brightness(.6); }

  /* ---------- scene 2: fast cuts ---------- */
  #s2a { background: #050505; }
  #clock { font-family: 'Heebo'; font-weight: 900; font-size: 330px; color: #ff2d3d; direction: ltr; letter-spacing: 8px;
           text-shadow: 0 0 40px #ff2d3d, 0 0 120px rgba(255,45,61,.6); }
  #clocklabel { position: absolute; top: 1200px; width: 100%; text-align: center; color: #ff8c95; font-size: 64px; font-weight: 700; opacity: .8; }
  #s2b { background: #2a2a2e; }
  #paper { width: 760px; height: 1000px; background: #f2efe6; border-radius: 10px; box-shadow: 0 40px 120px rgba(0,0,0,.6);
           padding: 70px 70px; color: #333; }
  #paper h3 { font-size: 64px; font-weight: 900; margin-bottom: 40px; }
  #paper .q { height: 18px; background: #c9c4b6; border-radius: 9px; margin: 34px 0; }
  #paper .x { color: #e01b2b; font-weight: 900; font-size: 60px; position: absolute; left: 90px; }
  #grade { position: absolute; left: 50px; top: 640px; width: 300px; height: 300px; border: 14px solid #e01b2b; border-radius: 50%;
           color: #e01b2b; font-size: 170px; font-weight: 900; display: flex; align-items: center; justify-content: center; direction: ltr; }
  #s2c { background: linear-gradient(180deg, #ffb46b 0%, #ffd08a 45%, #3f8f3a 45%, #2f6e2b 100%); }
  .runner { position: absolute; width: 120px; height: 360px; }
  #empty { position: absolute; width: 150px; height: 380px; border: 10px dashed rgba(255,255,255,.85); border-radius: 75px 75px 20px 20px; }
  #emptylbl { position: absolute; color: #fff; font-size: 56px; font-weight: 900; text-shadow: 0 4px 20px rgba(0,0,0,.5); white-space: nowrap; }

  /* ---------- scene 3: phone down, notebook open ---------- */
  #s3 { background: #3b2c22; }
  #desk { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #8a5d3b 0 140px, #7f5536 140px 280px); }
  #lamp { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,240,200,.85), rgba(255,230,180,0) 65%); mix-blend-mode: screen; }
  #phone3 { position: absolute; width: 330px; height: 660px; border-radius: 46px; background: #15151b; border: 10px solid #2a2a33; }
  #phone3 .glow { position: absolute; inset: 0; border-radius: 36px; background: linear-gradient(160deg, #3d5bff, #b13dff); }
  #nb { position: absolute; left: 50%; top: 50%; width: 900px; height: 640px; margin-left: -450px; margin-top: -240px; perspective: 2000px; }
  .page { position: absolute; top: 0; width: 450px; height: 640px; background: #fffdf6;
          background-image: repeating-linear-gradient(180deg, transparent 0 58px, #b9d3f0 58px 61px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  #pageL { left: 0; border-radius: 16px 0 0 16px; }
  #pageR { left: 450px; border-radius: 0 16px 16px 0; }
  #cover { position: absolute; left: 450px; top: 0; width: 450px; height: 640px; background: linear-gradient(135deg, #2b6fd6, #1b4aa0);
           border-radius: 0 16px 16px 0; transform-origin: 0 50%; backface-visibility: hidden; display:flex; align-items:center; justify-content:center;
           color: #fff; font-size: 64px; font-weight: 900; }
  .ink { position: absolute; right: 40px; height: 8px; background: #1c3f8a; border-radius: 4px; }
  #nbtitle { position: absolute; top: 10px; right: 40px; font-size: 54px; font-weight: 900; color: #1c3f8a; }
  #pen { position: absolute; width: 26px; height: 380px; background: linear-gradient(90deg, #f5c518, #d9a400); border-radius: 13px 13px 4px 4px; transform-origin: 50% 100%; }

  /* ---------- scene 4: final card ---------- */
  #s4 { background: linear-gradient(160deg, #ff5f6d 0%, #ffc371 100%); }
  #final { width: 100%; text-align: center; color: #fff; font-weight: 900; line-height: 1.05; text-shadow: 0 12px 50px rgba(120,20,40,.35); }
  #final .a { font-size: 165px; white-space: nowrap; display: block; }
  #final .b { font-size: 150px; white-space: nowrap; display: block; margin-top: 40px; color: #1a1033; text-shadow: none; }
  #handle { position: absolute; bottom: 260px; width: 100%; text-align: center; color: rgba(255,255,255,.9); font-size: 48px; font-weight: 700; }

  /* ---------- overlays ---------- */
  #topcap { position: absolute; top: 240px; left: 0; right: 0; text-align: center; }
  #topcap span { display: inline-block; background: #fff; color: #000; font-weight: 900; font-size: 84px; padding: 10px 40px; border-radius: 18px; }
  #sub { position: absolute; left: 60px; right: 60px; bottom: 300px; text-align: center; color: #fff; font-weight: 900; font-size: 76px; line-height: 1.25;
         text-shadow: 0 0 6px #000, 0 6px 22px rgba(0,0,0,.9); -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  #sub .w { display: inline-block; margin: 0 10px; }
  #sub .hl { color: #ffe14d; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #vign { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
  #grain { position: absolute; inset: -50px; opacity: .06; pointer-events: none;
           background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px); }
  #progress { position: absolute; left: 0; bottom: 0; height: 10px; background: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div id="stage">

  <!-- scene 1 -->
  <div class="scene" id="s1">
    <div id="phone1"><div id="feed"></div></div>
    <div id="hand"></div><div id="thumb"></div>
  </div>

  <!-- scene 2a: clock -->
  <div class="scene" id="s2a">
    <div class="center" id="clock">03:00</div>
    <div id="clocklabel">ומחר יש מבחן...</div>
  </div>

  <!-- scene 2b: test -->
  <div class="scene" id="s2b">
    <div class="center" id="paper">
      <h3>מבחן במתמטיקה</h3>
      <div class="q"></div><div class="q" style="width:70%"></div><div class="q"></div>
      <div class="q" style="width:55%"></div><div class="q"></div><div class="q" style="width:80%"></div>
      <div class="q"></div><div class="q" style="width:60%"></div><div class="q"></div><div class="q" style="width:75%"></div>
      <div class="x" style="top:280px">✗</div><div class="x" style="top:430px">✗</div><div class="x" style="top:640px">✗</div>
      <div id="grade">48</div>
    </div>
  </div>

  <!-- scene 2c: friends training -->
  <div class="scene" id="s2c">
    <svg id="runners" width="1080" height="1920" style="position:absolute;inset:0"></svg>
    <div id="empty"></div>
    <div id="emptylbl">...ואתה?</div>
  </div>

  <!-- scene 3 -->
  <div class="scene" id="s3">
    <div id="desk"></div>
    <div id="phone3"><div class="glow"></div></div>
    <div id="nb">
      <div class="page" id="pageL"></div>
      <div class="page" id="pageR"><div id="nbtitle">המטרות שלי</div></div>
      <div id="cover">מחברת</div>
    </div>
    <div id="pen"></div>
    <div id="lamp"></div>
  </div>

  <!-- scene 4 -->
  <div class="scene" id="s4">
    <div class="center" id="final"><span class="a">אתה מחליט.</span><span class="b">לא הפיד.</span></div>
    <div id="handle">⏸ שים את הטלפון רגע בצד</div>
  </div>

  <div id="vign"></div>
  <div id="grain"></div>
  <div id="topcap"><span>עוד סרטון אחד...</span></div>
  <div id="sub"></div>
  <div id="flash"></div>
  <div id="progress"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const outBack = k => { const c = 1.70158; return 1 + (c+1)*Math.pow(k-1,3) + c*Math.pow(k-1,2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

// feed cards
const cards = [['🎮','#ff3d6e,#7b2cff'],['😂','#00c6ff,#0072ff'],['🔥','#f7971e,#ffd200'],['🛹','#11998e,#38ef7d'],
               ['📺','#fc466b,#3f5efb'],['🤳','#ff9966,#ff5e62'],['🎧','#8e2de2,#4a00e0'],['🍕','#f953c6,#b91d73'],
               ['⚽','#56ab2f,#a8e063'],['👾','#373b44,#4286f4'],['💥','#e52d27,#b31217'],['🎮','#ff3d6e,#7b2cff']];
$('feed').innerHTML = cards.map(([e, g]) =>
  `<div class="card" style="background:linear-gradient(160deg,${g})">${e}
     <div class="bar"><span>❤️</span><span>💬</span><span>↗️</span></div>
     <div class="line"></div><div class="line line2"></div></div>`).join('');

// runners (friends training) as simple SVG stick figures
function runnerSVG(x, y, s, phase, color) {
  const sw = Math.sin(phase), cw = Math.cos(phase);
  const hip = [x, y], sh = [x + 10*s, y - 120*s], head = [x + 18*s, y - 160*s];
  const leg = (a) => { const k = [hip[0] + 45*s*Math.sin(a), hip[1] + 70*s]; const f = [k[0] - 30*s*Math.max(0, Math.sin(a)) + 10*s, k[1] + 75*s]; return `M${hip}L${k}L${f}`; };
  const arm = (a) => { const e = [sh[0] + 40*s*Math.sin(a), sh[1] + 55*s]; const h = [e[0] + 35*s, e[1] - 20*s*Math.cos(a)]; return `M${sh}L${e}L${h}`; };
  return `<g stroke="${color}" stroke-width="${22*s}" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="${leg(phase)}"/><path d="${leg(phase + Math.PI)}"/><path d="M${hip}L${sh}"/>
    <path d="${arm(phase + Math.PI)}"/><path d="${arm(phase)}"/></g>
    <circle cx="${head[0]}" cy="${head[1]}" r="${30*s}" fill="${color}"/>`;
}

// subtitles: [start, end, words, highlight indexes]
const subs = [
  [0.25, 3.0, ['עוד','דקה.','עוד','משחק.','עוד','סרטון.'], [1,3,5]],
  [3.2, 7.9, ['כל','"עכשיו"','קטן','גונב','לך','"אחר','כך"','גדול.'], [1,5,6]],
  [8.4, 11.9, ['מי','ששולט','ברגע,','שולט','בעתיד.'], [2,4]],
];
function renderSub(t) {
  const el = $('sub');
  const s = subs.find(([a, b]) => t >= a && t < b);
  if (!s) { el.innerHTML = ''; return; }
  const [a, b, words, hl] = s;
  const per = Math.min(0.42, (b - a - 0.6) / words.length);
  el.innerHTML = words.map((w, i) => {
    const k = prog(t, a + i * per, a + i * per + 0.18);
    const sc = k === 0 ? 0 : lerp(1.35, 1, ease(k));
    return `<span class="w ${hl.includes(i) ? 'hl' : ''}" style="opacity:${k > 0 ? 1 : 0};transform:scale(${sc})">${w}</span>`;
  }).join(' ');
  el.style.opacity = 1 - prog(t, b - 0.2, b);
}

function show(id, on) { $(id).style.opacity = on; }

window.render = function (t) {
  ['s1','s2a','s2b','s2c','s3','s4'].forEach(id => show(id, 0));
  let shake = 0, flash = 0;

  // scene 1 (0–3): scrolling at night
  if (t < 3.0) {
    show('s1', 1);
    const zoom = lerp(1.0, 1.12, t / 3);
    $('s1').style.transform = `scale(${zoom})`;
    // swipe every ~0.55s with ease
    const cycle = 0.55, n = Math.floor(t / cycle), k = ease(clamp((t % cycle) / 0.3));
    $('feed').style.transform = `translateY(${-(n + k) * 1092}px)`;
    $('thumb').style.transform = `rotate(${lerp(-8, 14, Math.sin(k * Math.PI))}deg) translateY(${-Math.sin(k*Math.PI)*60}px)`;
    $('phone1').style.boxShadow = `0 0 ${200 + 40*Math.sin(t*9)}px 60px rgba(90,140,255,.35)`;
  }
  // scene 2 (3–8): fast cuts
  else if (t < 4.6) {
    show('s2a', 1);
    const k = prog(t, 3.0, 3.25);
    $('clock').style.transform = `translate(-50%,-50%) scale(${lerp(1.6, 1, ease(k))})`;
    $('clock').style.opacity = (Math.floor(t * 4) % 2 === 0 || t < 3.8) ? 1 : 0.35;
    shake = (1 - k) * 18; flash = 1 - prog(t, 3.0, 3.15);
  }
  else if (t < 6.3) {
    show('s2b', 1);
    const k = prog(t, 4.6, 4.85), g = prog(t, 5.0, 5.3);
    $('paper').style.transform = `translate(-50%,-50%) rotate(${lerp(-14, -3, ease(k))}deg) scale(${lerp(1.3, 1, ease(k))})`;
    $('grade').style.transform = `scale(${g === 0 ? 0 : lerp(2.4, 1, outBack(g))}) rotate(-12deg)`;
    $('grade').style.opacity = g > 0 ? 1 : 0;
    shake = (g > 0 && g < 1 ? 14 * (1 - g) : 0) + (1 - k) * 12; flash = 1 - prog(t, 4.6, 4.75);
  }
  else if (t < 8.0) {
    show('s2c', 1);
    const k = prog(t, 6.3, 8.0);
    const cols = ['#1d2b53', '#7e2553', '#1d2b53', '#7e2553'];
    let svg = '';
    const xs = [180, 430, 680, 930];
    xs.forEach((x, i) => {
      if (i === 2) return; // the missing friend
      svg += runnerSVG(x - 60 + k * 60, 1160 + (i % 2) * 30, 1.6, t * 14 + i * 1.7, cols[i]);
    });
    $('runners').innerHTML = svg;
    $('empty').style.left = (680 - 75 + k * 60) + 'px'; $('empty').style.top = '880px';
    $('empty').style.opacity = 0.4 + 0.6 * Math.abs(Math.sin(t * 6));
    $('emptylbl').style.left = (650 - 150 + k * 60) + 'px'; $('emptylbl').style.top = '780px';
    $('s2c').style.transform = `scale(${lerp(1.05, 1.15, k)})`;
    shake = (1 - prog(t, 6.3, 6.5)) * 14; flash = 1 - prog(t, 6.3, 6.45);
    // drain color towards the end of the "bad" act
    $('s2c').style.filter = `saturate(${lerp(1, .6, k)})`;
  }
  // scene 3 (8–12): phone down, notebook opens, colors brighten
  else if (t < 12.0) {
    show('s3', 1);
    const put = ease(prog(t, 8.0, 8.9));         // phone moves away and flips off
    const open = ease(prog(t, 9.0, 10.0));       // cover opens
    const bright = ease(prog(t, 8.6, 11.0));     // colors brighten
    $('phone3').style.left = lerp(375, 40, put) + 'px';
    $('phone3').style.top = lerp(600, 1480, put) + 'px';
    $('phone3').style.transform = `rotate(${lerp(0, -38, put)}deg) scale(${lerp(1.1, .8, put)})`;
    $('phone3').querySelector('.glow').style.opacity = 1 - prog(t, 8.5, 8.9);
    $('cover').style.transform = `rotateY(${-180 * open}deg)`;
    $('cover').style.opacity = open > .5 ? 0 : 1;
    // ink lines being written
    let ink = '<div id="nbtitle">המטרות שלי</div>';
    const lines = [300, 260, 340, 220, 310, 280, 200];
    lines.forEach((w, i) => {
      const k = prog(t, 10.0 + i * 0.25, 10.0 + i * 0.25 + 0.25);
      if (k > 0) ink += `<div class="ink" style="top:${118 + i*61}px;width:${w*k}px"></div>`;
    });
    $('pageR').innerHTML = ink;
    const pk = prog(t, 10.0, 11.9), li = Math.min(6, Math.floor(pk * 7)), lk = (pk * 7) % 1;
    // right page spans x 540–990, y 720–1360; ink starts 40px from its right edge
    $('pen').style.left = (950 - 13 - lines[li] * lk) + 'px';
    $('pen').style.top = (720 + 118 + li * 61 - 380 + 4) + 'px';
    $('pen').style.transform = `rotate(${open > .9 ? -20 + 4*Math.sin(t*30) : 25}deg)`;
    $('pen').style.opacity = open > .9 ? 1 : 0;
    $('lamp').style.opacity = bright;
    $('s3').style.filter = `saturate(${lerp(.25, 1.25, bright)}) brightness(${lerp(.45, 1.12, bright)})`;
    $('s3').style.transform = `scale(${lerp(1.12, 1.0, ease(prog(t, 8, 12)))})`;
  }
  // scene 4 (12–15): final message
  else {
    show('s4', 1);
    const a = prog(t, 12.0, 12.35), b = prog(t, 12.6, 12.95);
    const fin = $('final').children;
    fin[0].style.transform = `scale(${a === 0 ? 0 : lerp(2.2, 1, outBack(a))})`; fin[0].style.opacity = a > 0 ? 1 : 0;
    fin[1].style.transform = `scale(${b === 0 ? 0 : lerp(2.2, 1, outBack(b))})`; fin[1].style.opacity = b > 0 ? 1 : 0;
    $('final').style.transform = `translate(-50%,-50%) scale(${lerp(1, 1.06, prog(t, 13, 15))})`;
    $('handle').style.opacity = prog(t, 13.4, 13.8);
    shake = (b > 0 && b < 1) ? 16 * (1 - b) : (a > 0 && a < 1 ? 12 * (1 - a) : 0);
    flash = 0.8 * (1 - prog(t, 12.0, 12.2));
  }

  // global overlays
  $('topcap').style.opacity = t < 2.85 ? clamp(t / 0.2) : 0;
  $('topcap').style.transform = `scale(${lerp(1.3, 1, ease(prog(t, 0, .25)))})`;
  renderSub(t);
  $('flash').style.opacity = flash;
  $('grain').style.transform = `translate(${(t*997)%40}px, ${(t*613)%40}px)`;
  $('grain').style.opacity = t < 8 ? .08 : .03;
  $('vign').style.opacity = t < 8 ? 1 : lerp(1, .3, prog(t, 8, 11));
  const sx = shake ? (Math.sin(t * 97) * shake) : 0, sy = shake ? (Math.cos(t * 71) * shake) : 0;
  $('stage').style.transform = `translate(${sx}px, ${sy}px)`;
  $('progress').style.width = (t / 15 * 100) + '%';
};
window.render(0);
</script>
</body>
</html>
